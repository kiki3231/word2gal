<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Word2Gal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #f3ebe1;
      --ink-dim: #c9b8a6;
      --wood: #2b211c;
      --wood-deep: #16110f;
      --gold: #e0b06a;
      --dusk: #6e8aa8;
      --panel: rgba(22, 17, 15, 0.78);
      --panel-edge: rgba(224, 176, 106, 0.45);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      font-family: "Zen Kaku Gothic New", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(ellipse at 50% 0%, #3a2c28 0%, var(--wood-deep) 55%, #0a0807 100%);
      color: var(--ink);
      user-select: none;
    }
    #frame {
      height: 100%;
      display: grid;
      place-items: center;
      padding: clamp(0.5rem, 2vw, 1.25rem);
    }
    #stage {
      position: relative;
      width: min(100%, 1120px);
      aspect-ratio: 16 / 9;
      max-height: calc(100vh - 1.5rem);
      overflow: hidden;
      border-radius: 18px;
      background: #000 center / cover no-repeat;
      box-shadow:
        0 0 0 1px rgba(224, 176, 106, 0.22),
        0 30px 80px rgba(0, 0, 0, 0.55);
      transition: background-image 0.45s ease;
    }
    #stage::before {
      content: "";
      position: absolute; inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.45) 100%),
        linear-gradient(180deg, rgba(110,138,168,0.12), transparent 35%, rgba(20,12,8,0.35) 100%);
      z-index: 1;
    }
    #stage::after {
      content: "";
      position: absolute; inset: 0;
      pointer-events: none;
      opacity: 0.08;
      z-index: 2;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    #sprite {
      position: absolute;
      bottom: 12%;
      right: 8%;
      height: 78%;
      max-width: 42%;
      object-fit: contain;
      object-position: bottom center;
      pointer-events: none;
      z-index: 3;
      filter: drop-shadow(0 18px 28px rgba(0,0,0,0.45));
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    #sprite.show {
      opacity: 1;
      transform: translateY(0);
    }
    #sprite.hidden { display: none; }
    #ui {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 0 1.4rem 1.3rem;
      z-index: 4;
    }
    #textbox {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--panel-edge);
      border-radius: 4px 18px 18px 18px;
      padding: 1.15rem 1.35rem 1.35rem;
      min-height: 7.8rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.35);
      cursor: pointer;
    }
    #textbox::before {
      content: "";
      position: absolute;
      left: 1.2rem; right: 1.2rem; top: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.7;
    }
    #name {
      display: inline-block;
      font-family: "Noto Serif SC", serif;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--wood-deep);
      background: linear-gradient(180deg, #f0d7a8, var(--gold));
      padding: 0.22rem 0.85rem 0.28rem;
      border-radius: 999px;
      margin-bottom: 0.55rem;
      min-height: 1.2em;
      transform: translateY(-1.55rem);
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    }
    #name:empty { display: none; }
    #text {
      font-size: clamp(1rem, 1.7vw, 1.2rem);
      line-height: 1.75;
      white-space: pre-wrap;
      color: var(--ink);
      text-shadow: 0 1px 2px rgba(0,0,0,0.35);
    }
    #hint {
      position: absolute;
      right: 1.1rem; bottom: 0.7rem;
      color: var(--gold);
      font-size: 0.85rem;
      opacity: 0.75;
      animation: blink 1.2s steps(2, end) infinite;
    }
    @keyframes blink { 50% { opacity: 0.2; } }
    #choices {
      display: none;
      flex-direction: column;
      gap: 0.55rem;
      margin-top: 0.35rem;
    }
    #choices.show { display: flex; }
    #choices button {
      border: 1px solid rgba(224,176,106,0.35);
      background: linear-gradient(90deg, rgba(43,33,28,0.95), rgba(55,42,36,0.9));
      border-radius: 12px;
      padding: 0.8rem 1rem;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      color: var(--ink);
      font-family: inherit;
      transition: border-color 0.2s, transform 0.15s, background 0.2s;
    }
    #choices button:hover {
      border-color: var(--gold);
      transform: translateX(4px);
      background: linear-gradient(90deg, rgba(70,52,40,0.98), rgba(55,42,36,0.95));
    }
    #toolbar {
      position: absolute;
      top: 0.85rem; right: 0.85rem;
      display: flex; gap: 0.4rem;
      z-index: 5;
    }
    #toolbar button {
      border: 1px solid rgba(224,176,106,0.3);
      border-radius: 999px;
      padding: 0.38rem 0.85rem;
      background: rgba(22,17,15,0.72);
      color: var(--ink-dim);
      font-size: 0.82rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      font-family: inherit;
    }
    #toolbar button:hover { color: var(--gold); border-color: var(--gold); }
    #ending-banner {
      display: none;
      position: absolute; inset: 0;
      background: rgba(10,8,7,0.62);
      align-items: center; justify-content: center;
      color: var(--ink);
      font-family: "Noto Serif SC", serif;
      font-size: clamp(1.2rem, 2.5vw, 1.7rem);
      text-align: center;
      padding: 2rem;
      z-index: 6;
      white-space: pre-wrap;
      line-height: 1.7;
    }
    #ending-banner.show { display: flex; animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @media (max-width: 720px) {
      #stage { aspect-ratio: auto; height: calc(100vh - 1rem); border-radius: 12px; }
      #sprite { right: 50%; transform: translateX(50%); max-width: 70%; height: 58%; bottom: 22%; }
      #sprite.show { transform: translateX(50%); }
    }
  </style>
</head>
<body>
  <div id="frame">
    <div id="stage">
      <div id="toolbar">
        <button type="button" id="btn-save">存档</button>
        <button type="button" id="btn-load">读档</button>
        <button type="button" id="btn-mute">音效开</button>
      </div>
      <img id="sprite" class="hidden" alt="" />
      <div id="ui">
        <div id="textbox">
          <div id="name"></div>
          <div id="text"></div>
          <div id="choices"></div>
          <div id="hint">▼</div>
        </div>
      </div>
      <div id="ending-banner"></div>
    </div>
  </div>

  <!-- AGENT: replace only the JSON text content of these two tags. Do not edit player logic below. -->
  <script id="w2g-script" type="application/json">{"meta":{"title":"音乐室匿名信","stylePack":"daily-heal"},"nodes":[{"id":"scene_music_room","type":"scene","background":"music_room"},{"id":"n1","type":"narration","text":"放学后的旧音乐室，灰尘在斜光里浮动。"},{"id":"d1","type":"dialogue","speaker":"小悠","text":"你看，信上没署名！","emotion":"surprise","voiceTag":"gasp"},{"id":"d2","type":"dialogue","speaker":"阿凛","text":"……先别慌。","emotion":"neutral"},{"id":"c1","type":"choice","options":[{"label":"当场拆开","goto":"end_open"},{"label":"带回家晚上再拆","goto":"end_home"}]},{"id":"end_open","type":"ending","text":"信纸散开，两人面面相觑。"},{"id":"end_home","type":"ending","text":"信封被塞进书包，心事也一起带回家。"}]}</script>
  <script id="w2g-assets" type="application/json">{"speakerToId":{"小悠":"you","阿凛":"rin"},"chars":{"default":"assets/you_neutral.png","you_neutral":"assets/you_neutral.png","you_surprise":"assets/you_surprise.png","rin_neutral":"assets/rin_neutral.png"},"bgs":{"default":"assets/bg_music_room.png","music_room":"assets/bg_music_room.png"},"sfx":{"gasp":"assets/sfx/gasp.wav","surprised":"assets/sfx/surprised.wav","soft_affirm":"assets/sfx/soft_affirm.wav","sigh":"assets/sfx/sigh.wav","soft_laugh":"assets/sfx/soft_laugh.wav","angry_huff":"assets/sfx/angry_huff.wav"}}</script>

  <script>
  (function () {
    "use strict";

    function parseJsonTag(id) {
      var el = document.getElementById(id);
      var raw = (el && el.textContent || "").trim();
      if (!raw || raw.indexOf("__") === 0) {
        throw new Error("Missing baked data in #" + id);
      }
      return JSON.parse(raw);
    }

    var script, assets;
    try {
      script = parseJsonTag("w2g-script");
      assets = parseJsonTag("w2g-assets");
    } catch (e) {
      document.body.innerHTML = "<pre style='color:#fff;padding:2rem'>Word2Gal: 模板尚未填入剧本/资源。请用 Skill 打包后再打开。\n" + e.message + "</pre>";
      return;
    }

    var nodes = script.nodes || [];
    var byId = {};
    nodes.forEach(function (n) { byId[n.id] = n; });
    var order = nodes.map(function (n) { return n.id; });
    var idx = 0;
    var currentId = order[0];
    var typing = false;
    var typeTimer = null;
    var fullText = "";
    var muted = false;
    var audioUnlocked = false;
    var lastSfxNode = null;
    var saveKey = "w2g:" + ((script.meta && script.meta.title) || "story");

    var stage = document.getElementById("stage");
    var sprite = document.getElementById("sprite");
    var nameEl = document.getElementById("name");
    var textEl = document.getElementById("text");
    var choicesEl = document.getElementById("choices");
    var endingEl = document.getElementById("ending-banner");
    var textbox = document.getElementById("textbox");
    var hintEl = document.getElementById("hint");

    function assetUrl(group, key) {
      var bag = assets[group] || {};
      if (key && bag[key]) return bag[key];
      if (bag.default) return bag.default;
      if (group === "chars" && bag.default_neutral) return bag.default_neutral;
      return "";
    }

    function speakerId(displayName) {
      var map = assets.speakerToId || {};
      return map[displayName] || displayName;
    }

    function setBackground(bgKey) {
      var url = assetUrl("bgs", bgKey || "default");
      stage.style.backgroundImage = url ? 'url("' + url + '")' : "none";
    }

    function setSprite(speaker, emotion) {
      if (!speaker) {
        sprite.classList.remove("show");
        sprite.classList.add("hidden");
        sprite.removeAttribute("src");
        return;
      }
      var id = speakerId(speaker);
      var key = id + "_" + (emotion || "neutral");
      var url = assetUrl("chars", key) || assetUrl("chars", id + "_neutral") || assetUrl("chars", "default");
      if (!url) {
        sprite.classList.add("hidden");
        return;
      }
      sprite.classList.remove("hidden");
      if (sprite.getAttribute("src") !== url) {
        sprite.classList.remove("show");
        sprite.onload = function () { sprite.classList.add("show"); };
        sprite.src = url;
        if (sprite.complete) sprite.classList.add("show");
      } else {
        sprite.classList.add("show");
      }
    }

    function playSfx(tag, nodeId) {
      if (muted || !tag || !audioUnlocked) return;
      if (nodeId && lastSfxNode === nodeId) return;
      var url = assetUrl("sfx", tag);
      if (!url) return;
      lastSfxNode = nodeId || null;
      try {
        var a = new Audio(url);
        a.volume = 0.55;
        a.play().catch(function () {});
      } catch (e) {}
    }

    function clearType() {
      if (typeTimer) {
        clearInterval(typeTimer);
        typeTimer = null;
      }
      typing = false;
    }

    function typewrite(text, done) {
      clearType();
      fullText = text || "";
      textEl.textContent = "";
      if (!fullText) {
        if (done) done();
        return;
      }
      typing = true;
      var i = 0;
      typeTimer = setInterval(function () {
        i += 1;
        textEl.textContent = fullText.slice(0, i);
        if (i >= fullText.length) {
          clearType();
          if (done) done();
        }
      }, 26);
    }

    function revealText() {
      if (!typing) return false;
      clearType();
      textEl.textContent = fullText;
      return true;
    }

    function showChoices(options) {
      hintEl.style.display = "none";
      choicesEl.innerHTML = "";
      options.forEach(function (opt) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = opt.label;
        btn.addEventListener("click", function (ev) {
          ev.stopPropagation();
          gotoNode(opt.goto);
        });
        choicesEl.appendChild(btn);
      });
      choicesEl.classList.add("show");
    }

    function hideChoices() {
      choicesEl.classList.remove("show");
      choicesEl.innerHTML = "";
      hintEl.style.display = "";
    }

    function gotoNode(id) {
      if (!byId[id]) return;
      currentId = id;
      idx = order.indexOf(id);
      render();
    }

    function advance() {
      audioUnlocked = true;
      var node = byId[currentId];
      if (node && node.type === "dialogue" && node.voiceTag) {
        playSfx(node.voiceTag, node.id);
      }
      if (revealText()) return;
      if (choicesEl.classList.contains("show")) return;
      if (!node) return;
      if (node.type === "ending") return;
      if (node.type === "choice") return;
      var next = order[idx + 1];
      if (next) gotoNode(next);
    }

    function render() {
      var node = byId[currentId];
      if (!node) return;
      hideChoices();
      endingEl.classList.remove("show");
      nameEl.textContent = "";

      if (node.type === "scene") {
        setBackground(node.background);
        setSprite(null);
        typewrite(node.text || "……", null);
        return;
      }
      if (node.type === "narration") {
        setSprite(null);
        typewrite(node.text, null);
        return;
      }
      if (node.type === "dialogue") {
        nameEl.textContent = node.speaker || "";
        setSprite(node.speaker, node.emotion);
        playSfx(node.voiceTag, node.id);
        typewrite(node.text, null);
        return;
      }
      if (node.type === "choice") {
        setSprite(null);
        textEl.textContent = "请选择：";
        showChoices(node.options || []);
        return;
      }
      if (node.type === "ending") {
        setSprite(null);
        typewrite(node.text || "（终）", function () {
          endingEl.textContent = "— 结局 —\n" + (node.text || "");
          endingEl.classList.add("show");
        });
      }
    }

    textbox.addEventListener("click", function (ev) {
      if (ev.target.closest("#choices")) return;
      advance();
    });
    document.addEventListener("keydown", function (ev) {
      if (ev.code === "Space" || ev.code === "Enter") {
        ev.preventDefault();
        advance();
      }
    });

    document.getElementById("btn-save").addEventListener("click", function (ev) {
      ev.stopPropagation();
      try {
        localStorage.setItem(saveKey, JSON.stringify({ nodeId: currentId }));
        alert("已存档");
      } catch (e) {
        alert("存档失败");
      }
    });
    document.getElementById("btn-load").addEventListener("click", function (ev) {
      ev.stopPropagation();
      try {
        var raw = localStorage.getItem(saveKey);
        if (!raw) { alert("没有存档"); return; }
        var data = JSON.parse(raw);
        if (data.nodeId && byId[data.nodeId]) gotoNode(data.nodeId);
        else alert("存档无效");
      } catch (e) {
        alert("读档失败");
      }
    });
    document.getElementById("btn-mute").addEventListener("click", function (ev) {
      ev.stopPropagation();
      muted = !muted;
      ev.currentTarget.textContent = muted ? "音效关" : "音效开";
    });

    if (script.meta && script.meta.title) document.title = script.meta.title;
    setBackground("default");
    render();
  })();
  </script>
</body>
</html>
