<!DOCTYPE html>
<html lang="zh-CN" data-theme="warm_daily">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Word2Gal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    /* 基础布局：近全屏；主题变量见下方注入块 */
    :root {
      --ink: #f7f1ea;
      --ink-dim: #c9b8a6;
      --wood-deep: #0c0a09;
      --gold: #e0b06a;
      --panel: rgba(18, 14, 12, 0.88);
      --panel-edge: rgba(224, 176, 106, 0.45);
      --page-bg: #0c0a09;
      --stage-radius: 0px;
      --name-ink: #16110f;
    }
    /* W2G_THEME_CSS_START */

/* warm_daily — 日常治愈：暮光暖木 */
:root {
  --ink: #f7f1ea;
  --ink-dim: #cbb9a6;
  --gold: #e0b06a;
  --panel: rgba(22, 16, 12, 0.86);
  --panel-edge: rgba(224, 176, 106, 0.5);
  --page-bg: #1a1210;
  --name-ink: #1a120e;
}

    
    /* W2G_THEME_CSS_END */
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; width: 100%;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      background: var(--page-bg);
      color: var(--ink);
      user-select: none;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    #frame {
      height: 100%;
      width: 100%;
      display: grid;
      place-items: stretch;
      padding: 0;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      aspect-ratio: auto;
      overflow: hidden;
      border-radius: var(--stage-radius);
      background: #000 center / cover no-repeat;
      isolation: isolate;
      transition: background-image 0.45s ease;
    }
    #bg-fx {
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
        radial-gradient(ellipse at center, transparent 48%, rgba(0,0,0,0.38) 100%),
        linear-gradient(180deg, rgba(255,255,255,0.04), transparent 30%, rgba(0,0,0,0.28) 100%);
    }
    #sprite {
      position: absolute;
      bottom: 8%;
      right: 4%;
      height: min(88vh, 92%);
      max-width: 48%;
      object-fit: contain;
      object-position: bottom center;
      pointer-events: none;
      z-index: 3;
      mix-blend-mode: normal;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.28s ease, transform 0.28s ease;
      filter: drop-shadow(0 16px 28px rgba(0,0,0,0.55));
      image-rendering: auto;
    }
    #sprite.show { opacity: 1; transform: translateY(0); }
    #sprite.hidden { display: none; }
    #ui {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 0 clamp(1.2rem, 3vw, 2.5rem) clamp(1.2rem, 2.5vh, 2rem);
      z-index: 5;
    }
    #textbox {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--panel-edge);
      border-radius: 6px 20px 20px 20px;
      padding: 1.35rem 1.6rem 1.55rem;
      min-height: clamp(7.5rem, 18vh, 10rem);
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 48px rgba(0,0,0,0.4);
      cursor: pointer;
      max-width: 1100px;
      margin: 0 auto;
    }
    #textbox::before {
      content: "";
      position: absolute;
      left: 1.2rem; right: 1.2rem; top: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.7;
    }
    #name {
      display: inline-block;
      font-family: "Noto Serif SC", "Noto Sans SC", serif;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--name-ink);
      background: linear-gradient(180deg, color-mix(in srgb, var(--gold) 70%, #fff), var(--gold));
      padding: 0.3rem 1rem 0.34rem;
      border-radius: 999px;
      margin-bottom: 0.45rem;
      min-height: 1.2em;
      transform: translateY(-1.6rem);
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    }
    #name:empty { display: none; }
    #text {
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      font-size: clamp(1.12rem, 2vw, 1.4rem);
      font-weight: 500;
      line-height: 1.9;
      letter-spacing: 0.045em;
      white-space: pre-wrap;
      color: var(--ink);
      text-shadow: 0 1px 2px rgba(0,0,0,0.45);
      -webkit-font-smoothing: antialiased;
    }
    #hint {
      position: absolute;
      right: 1.2rem; bottom: 0.8rem;
      color: var(--gold);
      font-size: 0.9rem;
      opacity: 0.75;
      animation: blink 1.2s steps(2, end) infinite;
    }
    @keyframes blink { 50% { opacity: 0.2; } }
    #choices {
      display: none;
      flex-direction: column;
      gap: 0.6rem;
      margin-top: 0.4rem;
    }
    #choices.show { display: flex; }
    #choices button {
      border: 1px solid color-mix(in srgb, var(--gold) 40%, transparent);
      background: color-mix(in srgb, var(--panel) 90%, #000);
      border-radius: 12px;
      padding: 0.85rem 1.1rem;
      font-size: 1.05rem;
      text-align: left;
      cursor: pointer;
      color: var(--ink);
      font-family: inherit;
      transition: border-color 0.2s, transform 0.15s;
    }
    #choices button:hover {
      border-color: var(--gold);
      transform: translateX(4px);
    }
    #toolbar {
      position: absolute;
      top: 1rem; right: 1rem;
      display: flex; gap: 0.45rem;
      z-index: 6;
    }
    #toolbar button {
      border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent);
      border-radius: 999px;
      padding: 0.42rem 0.95rem;
      background: color-mix(in srgb, var(--panel) 92%, #000);
      color: var(--ink-dim);
      font-size: 0.88rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      font-family: inherit;
    }
    #toolbar button:hover { color: var(--gold); border-color: var(--gold); }
    #ending-banner {
      display: none;
      position: absolute; inset: 0;
      background: rgba(8,6,5,0.66);
      align-items: center; justify-content: center;
      flex-direction: column;
      gap: 1.4rem;
      color: var(--ink);
      font-family: "Noto Serif SC", serif;
      font-size: clamp(1.3rem, 2.8vw, 1.9rem);
      text-align: center;
      padding: 2rem;
      z-index: 7;
      line-height: 1.75;
    }
    #ending-banner.show { display: flex; animation: fadeIn 0.5s ease; }
    #ending-text { white-space: pre-wrap; max-width: 36rem; }
    #btn-restart {
      border: 1px solid var(--gold);
      border-radius: 999px;
      padding: 0.7rem 1.6rem;
      background: color-mix(in srgb, var(--panel) 85%, var(--gold));
      color: var(--ink);
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      font-size: 1.05rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    #btn-restart:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @media (max-width: 720px) {
      #sprite { right: 50%; transform: translateX(50%); max-width: 85%; height: 62%; bottom: 20%; }
      #sprite.show { transform: translateX(50%); }
      #ui { padding: 0 0.75rem 0.85rem; }
    }
  </style>
</head>
<body>
  <div id="frame">
    <div id="stage">
      <div id="bg-fx" aria-hidden="true"></div>
      <div id="toolbar">
        <button type="button" id="btn-save">存档</button>
        <button type="button" id="btn-load">读档</button>
        <button type="button" id="btn-mute">音效开</button>
      </div>
      <img id="sprite" class="hidden" alt="" decoding="async" />
      <div id="ui">
        <div id="textbox">
          <div id="name"></div>
          <div id="text"></div>
          <div id="choices"></div>
          <div id="hint">▼</div>
        </div>
      </div>
      <div id="ending-banner">
        <div id="ending-text"></div>
        <button type="button" id="btn-restart">重新开始</button>
      </div>
    </div>
  </div>

  <script id="w2g-script" type="application/json">{"meta":{"title":"熊猫与初夏的风","stylePack":"daily-heal","mood":"warm_daily"},"nodes":[{"id":"sc1","type":"scene","background":"classroom_summer"},{"id":"n1","type":"narration","text":"我没有喝立希同学送我的饮料。端详着上面憨态可掬的熊猫图案，我试着把立希同学的脸与熊猫叠在一起。"},{"id":"n2","type":"narration","text":"不知道她为何特别中意熊猫，但她给人的印象色，的确和熊猫一样素雅。"},{"id":"d_flash","type":"dialogue","speaker":"立希","text":"海铃，你好像一直是同一副表情。","emotion":"neutral"},{"id":"d_umiri1","type":"dialogue","speaker":"海铃","text":"……我会注意不把情绪写在脸上。不过多数时候，也没什么值得心情波动的事。","emotion":"neutral"},{"id":"n3","type":"narration","text":"和立希同学认识不算久。她初中在羽丘，鼓手，孤僻，却把乐队看得很重。我不太想触她的逆鳞，旁敲侧击也从未得到答案。"},{"id":"n4","type":"narration","text":"课间她要么补觉，要么戴着耳机推敲什么。伏案时她不会把脸埋起来——睫毛很长，泪痣与深色长发，像罩着一层冷淡的纱。"},{"id":"n5","type":"narration","text":"立希同学好像有喜欢的人了。从概率上推测，大概是 MyGO 里的同伴。主唱的可能性比较高。"},{"id":"n6","type":"narration","text":"上课铃响了。她仍没有醒来的迹象。再旁观一会儿好了——或许能见到她被叫醒的惊慌模样。"},{"id":"n7","type":"narration","text":"和立希同学说话的时候心情会变好。这种感觉，算是「喜欢」吗？为什么我会想到这个词？很微妙。非常微妙。"},{"id":"n8","type":"narration","text":"夏日的阳光泻进教室。白色制服下裙与深黑长发在风中飘舞，黑与白缓缓相融。要是时间永远停在这一刻就好了。"},{"id":"n9","type":"narration","text":"直到下课铃响，她也没有醒来。老师和周围的人都没有叫醒她的意思——还是只能由我来。"},{"id":"d_umiri_smile","type":"dialogue","speaker":"海铃","text":"……不知为何，嘴角有点上扬。","emotion":"smile","voiceTag":"soft_affirm"},{"id":"n10","type":"narration","text":"本想用笔记本轻轻拍醒她。举手的那一刻，我却有了更大胆的想法——蹲下身，与她的脸齐平。"},{"id":"n11","type":"narration","text":"距离匀缓缩近。闭阖的睫毛愈发清晰。我在只差一点点的地方停下，深吸一口气。"},{"id":"d_blow","type":"dialogue","speaker":"海铃","text":"呼————","emotion":"soft_shy"},{"id":"d_taki_wake","type":"dialogue","speaker":"立希","text":"唔，海铃？","emotion":"surprise","voiceTag":"gasp"},{"id":"d_umiri2","type":"dialogue","speaker":"海铃","text":"放学了哦，立希同学——睡眠不足会影响到 Live 的。","emotion":"neutral"},{"id":"d_taki_thanks","type":"dialogue","speaker":"立希","text":"……嗯，谢谢。","emotion":"soft_shy"},{"id":"n12","type":"narration","text":"我放下笔记准备离去，她却一把握住我的手腕。"},{"id":"d_umiri_shock","type":"dialogue","speaker":"海铃","text":"难不成被发现了！？","emotion":"surprise","voiceTag":"gasp"},{"id":"d_taki_gift","type":"dialogue","speaker":"立希","text":"谢礼。","emotion":"neutral"},{"id":"n13","type":"narration","text":"掌心里是盒装巧克力味饮料。包装上的熊猫正对着我，露出真诚的笑脸。"},{"id":"d_taki_ask","type":"dialogue","speaker":"立希","text":"怎么？你也喜欢上巧克力味的了？","emotion":"neutral"},{"id":"d_umiri3","type":"dialogue","speaker":"海铃","text":"不好说呢。","emotion":"soft_shy"},{"id":"n14","type":"narration","text":"拆掉包装，插入吸管。醇厚的黑色甜蜜滑过舌尖，盒身被挤压，发出清脆的响声。"},{"id":"d_end","type":"dialogue","speaker":"海铃","text":"——喜欢哦。","emotion":"smile","voiceTag":"soft_laugh"},{"id":"ending","type":"ending","text":"我如此回应眼前的女孩。"}]}</script>
  <script id="w2g-assets" type="application/json">{"speakerToId":{"立希":"taki","海铃":"umiri"},"chars":{"taki_neutral":"assets/taki_neutral_cut.png","taki_soft_shy":"assets/taki_soft_shy_cut.png","taki_surprise":"assets/taki_surprise_cut.png","umiri_neutral":"assets/umiri_neutral_cut.png","umiri_smile":"assets/umiri_smile_cut.png","umiri_soft_shy":"assets/umiri_soft_shy_cut.png","umiri_surprise":"assets/umiri_surprise_cut.png","default":"assets/taki_neutral_cut.png"},"bgs":{"classroom_summer":"assets/bg_classroom_summer.png","default":"assets/bg_classroom_summer.png"},"sfx":{"gasp":"assets/sfx/gasp.wav","soft_affirm":"assets/sfx/soft_affirm.wav","soft_laugh":"assets/sfx/soft_laugh.wav"}}</script>

  <script>
  (function () {
    "use strict";

    function parseJsonTag(id) {
      var el = document.getElementById(id);
      var raw = (el && el.textContent || "").trim();
      if (!raw || raw.indexOf("__") === 0) {
        throw new Error("Missing baked data in #" + id);
      }
      return JSON.parse(raw);
    }

    var script, assets;
    try {
      script = parseJsonTag("w2g-script");
      assets = parseJsonTag("w2g-assets");
    } catch (e) {
      document.body.innerHTML = "<pre style='color:#fff;padding:2rem'>Word2Gal: 模板尚未填入剧本/资源。请用 Skill 打包后再打开。\n" + e.message + "</pre>";
      return;
    }

    var nodes = script.nodes || [];
    var byId = {};
    nodes.forEach(function (n) { byId[n.id] = n; });
    var order = nodes.map(function (n) { return n.id; });
    var idx = 0;
    var currentId = order[0];
    var typing = false;
    var typeTimer = null;
    var fullText = "";
    var muted = false;
    var audioUnlocked = false;
    var lastSfxNode = null;
    var saveKey = "w2g:" + ((script.meta && script.meta.title) || "story");

    var stage = document.getElementById("stage");
    var sprite = document.getElementById("sprite");
    var nameEl = document.getElementById("name");
    var textEl = document.getElementById("text");
    var choicesEl = document.getElementById("choices");
    var endingEl = document.getElementById("ending-banner");
    var textbox = document.getElementById("textbox");
    var hintEl = document.getElementById("hint");

    function assetUrl(group, key) {
      var bag = assets[group] || {};
      if (key && bag[key]) return bag[key];
      if (bag.default) return bag.default;
      if (group === "chars" && bag.default_neutral) return bag.default_neutral;
      return "";
    }

    function speakerId(displayName) {
      var map = assets.speakerToId || {};
      return map[displayName] || displayName;
    }

    function setBackground(bgKey) {
      var url = assetUrl("bgs", bgKey || "default");
      stage.style.backgroundImage = url ? 'url("' + url + '")' : "none";
    }

    function setSprite(speaker, emotion) {
      if (!speaker) {
        sprite.classList.remove("show");
        sprite.classList.add("hidden");
        sprite.removeAttribute("src");
        return;
      }
      var id = speakerId(speaker);
      var key = id + "_" + (emotion || "neutral");
      var url = assetUrl("chars", key) || assetUrl("chars", id + "_neutral") || assetUrl("chars", "default");
      if (!url) {
        sprite.classList.add("hidden");
        return;
      }
      sprite.classList.remove("hidden");
      if (sprite.getAttribute("src") !== url) {
        sprite.classList.remove("show");
        sprite.onload = function () { sprite.classList.add("show"); };
        sprite.src = url;
        if (sprite.complete) sprite.classList.add("show");
      } else {
        sprite.classList.add("show");
      }
    }

    function playSfx(tag, nodeId) {
      if (muted || !tag || !audioUnlocked) return;
      if (nodeId && lastSfxNode === nodeId) return;
      var url = assetUrl("sfx", tag);
      if (!url) return;
      lastSfxNode = nodeId || null;
      try {
        var a = new Audio(url);
        a.volume = 0.55;
        a.play().catch(function () {});
      } catch (e) {}
    }

    function clearType() {
      if (typeTimer) {
        clearInterval(typeTimer);
        typeTimer = null;
      }
      typing = false;
    }

    function typewrite(text, done) {
      clearType();
      fullText = text || "";
      textEl.textContent = "";
      if (!fullText) {
        if (done) done();
        return;
      }
      typing = true;
      var i = 0;
      typeTimer = setInterval(function () {
        i += 1;
        textEl.textContent = fullText.slice(0, i);
        if (i >= fullText.length) {
          clearType();
          if (done) done();
        }
      }, 26);
    }

    function revealText() {
      if (!typing) return false;
      clearType();
      textEl.textContent = fullText;
      return true;
    }

    function showChoices(options) {
      hintEl.style.display = "none";
      choicesEl.innerHTML = "";
      options.forEach(function (opt) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = opt.label;
        btn.addEventListener("click", function (ev) {
          ev.stopPropagation();
          gotoNode(opt.goto);
        });
        choicesEl.appendChild(btn);
      });
      choicesEl.classList.add("show");
    }

    function hideChoices() {
      choicesEl.classList.remove("show");
      choicesEl.innerHTML = "";
      hintEl.style.display = "";
    }

    function gotoNode(id) {
      if (!byId[id]) return;
      currentId = id;
      idx = order.indexOf(id);
      render();
    }

    function advance() {
      audioUnlocked = true;
      var node = byId[currentId];
      if (node && node.type === "dialogue" && node.voiceTag) {
        playSfx(node.voiceTag, node.id);
      }
      if (revealText()) return;
      if (choicesEl.classList.contains("show")) return;
      if (!node) return;
      if (node.type === "ending") return;
      if (node.type === "choice") return;
      var next = order[idx + 1];
      if (next) gotoNode(next);
    }

    function render() {
      var node = byId[currentId];
      if (!node) return;
      hideChoices();
      endingEl.classList.remove("show");
      nameEl.textContent = "";

      if (node.type === "scene") {
        setBackground(node.background);
        setSprite(null);
        typewrite(node.text || "……", null);
        return;
      }
      if (node.type === "narration") {
        setSprite(null);
        typewrite(node.text, null);
        return;
      }
      if (node.type === "dialogue") {
        nameEl.textContent = node.speaker || "";
        setSprite(node.speaker, node.emotion);
        playSfx(node.voiceTag, node.id);
        typewrite(node.text, null);
        return;
      }
      if (node.type === "choice") {
        setSprite(null);
        textEl.textContent = "请选择：";
        showChoices(node.options || []);
        return;
      }
      if (node.type === "ending") {
        setSprite(null);
        typewrite(node.text || "（终）", function () {
          endingEl.textContent = "— 结局 —\n" + (node.text || "");
          endingEl.classList.add("show");
        });
      }
    }

    textbox.addEventListener("click", function (ev) {
      if (ev.target.closest("#choices")) return;
      advance();
    });
    document.addEventListener("keydown", function (ev) {
      if (ev.code === "Space" || ev.code === "Enter") {
        ev.preventDefault();
        advance();
      }
    });

    document.getElementById("btn-save").addEventListener("click", function (ev) {
      ev.stopPropagation();
      try {
        localStorage.setItem(saveKey, JSON.stringify({ nodeId: currentId }));
        alert("已存档");
      } catch (e) {
        alert("存档失败");
      }
    });
    document.getElementById("btn-load").addEventListener("click", function (ev) {
      ev.stopPropagation();
      try {
        var raw = localStorage.getItem(saveKey);
        if (!raw) { alert("没有存档"); return; }
        var data = JSON.parse(raw);
        if (data.nodeId && byId[data.nodeId]) gotoNode(data.nodeId);
        else alert("存档无效");
      } catch (e) {
        alert("读档失败");
      }
    });
    document.getElementById("btn-mute").addEventListener("click", function (ev) {
      ev.stopPropagation();
      muted = !muted;
      ev.currentTarget.textContent = muted ? "音效关" : "音效开";
    });

    if (script.meta && script.meta.title) document.title = script.meta.title;
    setBackground("default");
    render();
  })();
  </script>
</body>
</html>
